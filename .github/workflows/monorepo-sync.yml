name: Sync From Monorepo

on:
  repository_dispatch:
    types:
      - monorepo-sync
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch in oaksprout/jinn-gemini"
        required: false
        type: string
      source_sha:
        description: "Optional source commit SHA override"
        required: false
        type: string
      target_branch:
        description: "Target branch in this repo (defaults to source_branch)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: monorepo-sync-${{ github.event.client_payload.source_branch || inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve sync variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_BRANCH="${{ github.event.client_payload.source_branch }}"
          SOURCE_SHA="${{ github.event.client_payload.source_sha }}"
          TARGET_BRANCH="${{ github.event.client_payload.source_branch }}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.source_branch }}" ]; then SOURCE_BRANCH="${{ inputs.source_branch }}"; fi
            if [ -n "${{ inputs.source_sha }}" ]; then SOURCE_SHA="${{ inputs.source_sha }}"; fi
            if [ -n "${{ inputs.target_branch }}" ]; then TARGET_BRANCH="${{ inputs.target_branch }}"; fi
          fi

          if [ -z "$SOURCE_BRANCH" ]; then SOURCE_BRANCH="main"; fi
          if [ -z "$TARGET_BRANCH" ]; then TARGET_BRANCH="$SOURCE_BRANCH"; fi

          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout standalone target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.target_branch }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Checkout monorepo snapshot
        uses: actions/checkout@v4
        with:
          repository: oaksprout/jinn-gemini
          ref: ${{ steps.vars.outputs.source_sha != '' && steps.vars.outputs.source_sha || steps.vars.outputs.source_branch }}
          path: monorepo
          fetch-depth: 1
          token: ${{ secrets.MONOREPO_READ_TOKEN }}

      - name: Sync jinn-node subtree contents
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '.env' \
            --exclude 'jinn.yaml' \
            --exclude '.operate/' \
            monorepo/jinn-node/ ./

      - name: Commit and push synced changes
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.vars.outputs.target_branch }}
          SOURCE_SHA: ${{ steps.vars.outputs.source_sha }}
          SOURCE_BRANCH: ${{ steps.vars.outputs.source_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi

          if [ -n "$SOURCE_SHA" ]; then
            MSG_SHA="${SOURCE_SHA:0:12}"
          else
            MSG_SHA="branch-${SOURCE_BRANCH}"
          fi

          git commit -m "sync: monorepo jinn-node ${MSG_SHA}"
          git push origin "HEAD:${TARGET_BRANCH}"
